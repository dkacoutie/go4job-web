[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Clé publique ("publishable key") logo.dev, faite pour être exposée
  # côté client — pas un secret. Mise ici (config file) car les
  # "Environment variables" du dashboard Netlify sont réservées au plan
  # payant sur ce compte (voir capture du 04/08/2026 : Team settings >
  # Environment variables > "This feature is available on paid plans").
  VITE_LOGO_DEV_TOKEN = "pk_Wjv_L8n9SMirp8Yg_fFbUQ"

# JR-SEO-audit-20260812 : sitemap dynamique sur les offres qualifiees
# (opportunite #1 de l'audit -- 0 offre dans l'ancien sitemap.xml statique
# de 17 URL). Genere par la fonction Edge Supabase public_sitemap
# (supabase/functions/public_sitemap), proxifiee ici pour que les URL
# restent sous le domaine du site (important pour Search Console, qui
# associe un sitemap au domaine ou il est servi). Doivent rester AVANT le
# redirect catch-all "/* -> /index.html" plus bas (Netlify evalue dans
# l'ordre, premiere regle qui matche gagne) -- force=true en plus par
# securite, au cas ou un fichier statique existerait au meme chemin.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://fygsoucyzmfainnbdpvw.supabase.co/functions/v1/public_sitemap?kind=index"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-pages.xml"
  to = "https://fygsoucyzmfainnbdpvw.supabase.co/functions/v1/public_sitemap?kind=pages"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-offres.xml"
  to = "https://fygsoucyzmfainnbdpvw.supabase.co/functions/v1/public_sitemap?kind=offres"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

# JR-0110 : fichiers sous /assets/* générés par Vite avec un hash de
# contenu dans le nom (ex. index-Twcww_0m.js) — un changement de contenu
# produit toujours un nom de fichier différent, donc un cache navigateur
# long et "immutable" ne peut jamais servir une version périmée. Réduit
# les téléchargements répétés sur les visites suivantes, notamment utile
# pour les connexions plus lentes/coûteuses d'une partie de l'audience
# JobRadar (Afrique francophone, cf. JR-0134).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
