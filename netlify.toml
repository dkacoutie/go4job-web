[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Clé publique ("publishable key") logo.dev, faite pour être exposée
  # côté client — pas un secret. Mise ici (config file) car les
  # "Environment variables" du dashboard Netlify sont réservées au plan
  # payant sur ce compte (voir capture du 04/08/2026 : Team settings >
  # Environment variables > "This feature is available on paid plans").
  VITE_LOGO_DEV_TOKEN = "pk_Wjv_L8n9SMirp8Yg_fFbUQ"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
