[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Clé publique ("publishable key") logo.dev, faite pour être exposée
  # côté client — pas un secret. Mise ici (config file) car les
  # "Environment variables" du dashboard Netlify sont réservées au plan
  # payant sur ce compte (voir capture du 04/08/2026 : Team settings >
  # Environment variables > "This feature is available on paid plans").
  VITE_LOGO_DEV_TOKEN = "pk_Wjv_L8n9SMirp8Yg_fFbUQ"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache"

# JR-0110 : fichiers sous /assets/* générés par Vite avec un hash de
# contenu dans le nom (ex. index-Twcww_0m.js) — un changement de contenu
# produit toujours un nom de fichier différent, donc un cache navigateur
# long et "immutable" ne peut jamais servir une version périmée. Réduit
# les téléchargements répétés sur les visites suivantes, notamment utile
# pour les connexions plus lentes/coûteuses d'une partie de l'audience
# JobRadar (Afrique francophone, cf. JR-0134).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
